# alembic.ini — Configuración de Alembic para GymPro PostgreSQL
#
# La URL real se sobreescribe desde variables de entorno en migrations/env.py,
# por lo que este valor placeholder nunca se usa directamente en producción.
#
# Uso:
#   cd api/
#   alembic upgrade head              # aplicar todas las migraciones
#   alembic revision --autogenerate -m "descripcion"  # generar nueva migración
#   alembic downgrade -1              # revertir la última migración
#   alembic history                   # ver historial

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Placeholder — env.py lo sobreescribe con POSTGRES_URI
sqlalchemy.url = postgresql+psycopg2://gymuser:gympassword@localhost:5432/gymprodb

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
