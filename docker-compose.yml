# docker-compose.yml — Orquestación de servicios GymPro
#
# ── Requisitos antes de levantar esto en una máquina nueva ──────────────────
#   - Docker Engine 23+ (incluye BuildKit por defecto). Si `docker buildx version`
#     falla, instala el plugin buildx de tu distro:
#       Arch/CachyOS:  sudo pacman -S docker-buildx
#       Debian/Ubuntu: sudo apt install docker-buildx-plugin
#       macOS/Windows: Docker Desktop ya lo incluye.
#   - Docker Compose v2 (viene como plugin `docker compose`, no el binario viejo
#     `docker-compose`). Verifica con: docker compose version
#
# Uso:
#   cp api/.env.example api/.env   # completar con tus credenciales reales
#   docker compose up --build -d
#   docker compose logs -f
#
# Servicios:
#   postgres → PostgreSQL 16 (plataforma, finanzas, multi-tenant)
#   mongo    → MongoDB 7 (datos operativos: miembros, rutinas, pagos, etc.)
#   redis    → cache interno y rate limiting (Flask-Limiter)
#   api      → Flask + Gunicorn (depende de postgres, mongo, redis, ollama)
#   web      → React bundle servido por nginx, proxea /api/ → api:5000
#   ollama   → LLM local para AI ETL
#
# ── Nombre explícito del proyecto ────────────────────────────────────────────
# Sin esto, Compose deriva el nombre del proyecto del nombre de la carpeta
# (ej. "SistemaGYM", "sistemagym-saas", "saas" según cómo cada quien clonó el
# repo). Eso namespacea contenedores/redes/volúmenes de forma distinta en cada
# máquina y es la causa típica de colisiones de puertos con contenedores
# sueltos de otros proyectos (redis, mongo) que alguien más pueda tener
# corriendo. Fijar el nombre aquí garantiza el mismo namespace siempre:
# contenedores como "sistemagym-api-1", red "sistemagym_gympro", etc.
name: sistemagym

services:

  # ── PostgreSQL (Sprint 2 — plataforma, finanzas, multi-tenant) ───────────────
  # Roles, Gimnasios y Usuarios viven aquí. La URI se lee de POSTGRES_URI en api/.env.
  # Para producción en EC2, asegurarse de que el security group solo abra 5432
  # hacia la red interna (no al exterior), y NO exponer "ports" en absoluto.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-gymprodb}
      POSTGRES_USER:     ${POSTGRES_USER:-gymuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gympassword}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymuser} -d ${POSTGRES_DB:-gymprodb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - gympro
    # Puerto expuesto al host para herramientas de gestión (DBeaver, psql local).
    # Configurable vía POSTGRES_HOST_PORT por si 5433 ya está ocupado en tu
    # máquina (ej. otro proyecto, u otro Postgres local instalado).
    # Comentar/quitar en producción y controlar acceso vía security groups.
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

  # ── MongoDB local ────────────────────────────────────────────────────────────
  # Sin autenticación en dev. Para producción en EC2, agregar:
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: admin
  #     MONGO_INITDB_ROOT_PASSWORD: secreto
  # y actualizar MONGO_URI en api/.env a mongodb://admin:secreto@mongo:27017/gymdb
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - gympro
    # Puerto expuesto al host para MongoDB Compass / mongosh local.
    # Configurable vía MONGO_HOST_PORT — el default 27035 evita el puerto
    # estándar 27017 (frecuentemente ocupado por un Mongo local o de otro
    # proyecto) y los rangos que Windows/Hyper-V suele reservar
    # (26935-27034 y 27046-27145 en algunas instalaciones).
    ports:
      - "${MONGO_HOST_PORT:-27035}:27017"

  # ── Redis ────────────────────────────────────────────────────────────────────
  # Sin puerto expuesto al host: es cache/rate-limiting interno, no necesita
  # acceso externo. Si en algún momento necesitas inspeccionarlo desde el host,
  # usa `docker compose exec redis redis-cli` en vez de exponer el puerto.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - gympro

  # ── API Flask + Gunicorn ─────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      # Sin attestations de provenance/SBOM: evita exportar manifests extra y la
      # manifest-list, acelerando el export de la imagen en cada build.
      provenance: false
    restart: unless-stopped
    # env_file en cascada: primero los valores por defecto de desarrollo
    # (.env.example SÍ está versionado, así que un clon recién hecho arranca sin
    # pasos manuales) y luego .env como override OPCIONAL para secretos reales.
    # Docker Compose aplica los archivos en orden: las claves de .env pisan las de
    # .env.example.
    env_file:
      - ./api/.env.example
      - path: ./api/.env
        required: false
    # Sobreescribir URIs para que apunten a los contenedores por nombre de servicio
    environment:
      MONGO_URI:          mongodb://mongo:27017/gymdb
      REDIS_URL:          redis://redis:6379/0
      POSTGRES_URI:       postgresql+psycopg2://${POSTGRES_USER:-gymuser}:${POSTGRES_PASSWORD:-gympassword}@postgres:5432/${POSTGRES_DB:-gymprodb}
      # Variables individuales para pg_dump (service.py las lee con os.getenv)
      POSTGRES_HOST:      postgres
      POSTGRES_PORT:      "5432"
      POSTGRES_USER:      ${POSTGRES_USER:-gymuser}
      POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD:-gympassword}
      POSTGRES_DB:        ${POSTGRES_DB:-gymprodb}
      SPARK_ENABLED:      "true"
      PYTHONUNBUFFERED:   "1"
      OLLAMA_BASE_URL:    http://ollama:11434
      OLLAMA_MODEL:       ${OLLAMA_MODEL:-phi3:mini}
      # ── Zona horaria ────────────────────────────────────────────────────
      # TZ hace que datetime.now() devuelva la hora local del gimnasio en vez
      # de UTC. Sin esto, un movimiento hecho por la noche se guardaba con la
      # fecha del día siguiente. APP_TIMEZONE la usa app/utils/timezone.py.
      TZ:                 ${APP_TIMEZONE:-America/Mexico_City}
      APP_TIMEZONE:       ${APP_TIMEZONE:-America/Mexico_City}
    volumes:
      - ./backups:/app/storage/backups
      - ./uploads:/app/storage/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started  # No service_healthy: la API verifica Ollama en cada request
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - gympro

  # ── Web React + nginx ────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
      provenance: false
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gympro

  # ── Mobile Expo Dev Server ──────────────────────────────────────────────────
  # Metro NO necesita Docker. Usa start-mobile.ps1 en Windows para arrancar
  # el servidor Expo directamente con Node.js local (más simple y sin problemas
  # de red, volúmenes ni TTY).
  # Ver: mobile/README.md o start-mobile.ps1

  # ── Ollama — LLM local para AI ETL ──────────────────────────────────────────
  # Corre modelos open-source sin API externa ni costo.
  # Los pesos se persisten en ollama_models (~2 GB para phi3:mini).
  #
  # El modelo se descarga SOLO automáticamente en el primer arranque (ver command
  # más abajo); tarda ~2 min la primera vez y queda cacheado en el volumen. Para
  # forzar/cambiar el modelo: variable OLLAMA_MODEL en el .env o el entorno.
  #
  # Para GPU NVIDIA, descomentar el bloque "deploy":
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    #
    # Entrypoint que descarga el modelo AUTOMÁTICAMENTE en el primer arranque, para
    # que un integrante que levante el stack por primera vez no tenga que ejecutar
    # manualmente `ollama pull`. Los pesos quedan en el volumen ollama_models, así que
    # en arranques posteriores `ollama pull` detecta que ya existe y es un no-op.
    # Los `$$` escapan la interpolación de Compose para que la expansión ocurra en el
    # shell del contenedor (no en el host).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        pid=$$!
        echo "==> Esperando a que el servidor Ollama responda..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        echo "==> Descargando modelo $${OLLAMA_MODEL:-phi3:mini} (solo la primera vez)..."
        ollama pull "$${OLLAMA_MODEL:-phi3:mini}" || echo "AVISO: no se pudo descargar el modelo; se reintentará en el próximo arranque."
        echo "==> Ollama listo."
        wait $$pid
    healthcheck:
      # `ollama list` no depende de curl (que la imagen puede no incluir) y confirma
      # que el servidor responde. Pasa a healthy en cuanto el server está arriba,
      # aunque la descarga del modelo siga en curso en segundo plano.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 90s  # Ollama puede tardar 60-90s en el primer arranque (carga del runtime)
    networks:
      - gympro
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"

# ── Volúmenes persistentes ───────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local
  pg_data:
    driver: local
  ollama_models:
    driver: local

# ── Red interna ────────────────────────────────────────────────────────────────
networks:
  gympro:
    driver: bridge