# deploy/nginx/gympro.lat.conf
#
# Vhost de Nginx del HOST (VPS) para gympro.lat -- reverse proxy hacia el
# contenedor "web" del stack docker-compose.server.yml, que ya escucha en
# el puerto 8081 del host y adentro tiene su propio nginx que sirve el SPA
# y proxea /api/ hacia el contenedor "api" (ver web/nginx.conf y
# web/Dockerfile). Este vhost NO reemplaza a ese nginx interno: solo pone
# el dominio + TLS delante de el.
#
# Este archivo vive en el repo (rama server) solo como referencia versionada
# de la config real del VPS -- Nginx en el VPS lee su copia en
# /etc/nginx/sites-available/, no esta ruta del repo. Copialo ahi (ver
# comandos en el mensaje del chat) y no lo edites en el VPS sin reflejar
# el cambio aqui tambien.
#
# SOLO HTTP en este archivo. `certbot --nginx` reescribe este server block
# para agregar el bloque 443/SSL automaticamente al pedir el certificado --
# no hace falta escribirlo a mano.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name gympro.lat www.gympro.lat;

    # Limite generoso: subida de fotos/logos de gimnasio en base64 via JSON.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upgrade headers por si a futuro se usa websockets (p.ej. chat en
        # tiempo real); hoy no hace dano dejarlos.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
