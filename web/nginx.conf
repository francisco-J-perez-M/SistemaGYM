server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Resolución DNS dinámica del backend ───────────────────────────────────
    # 127.0.0.11 es el DNS embebido de Docker (siempre disponible en redes bridge
    # definidas por el usuario, como la red "gympro"). valid=10s re-resuelve cada
    # 10 s en lugar de cachear la IP del contenedor "api" al arrancar. Junto con el
    # uso de la variable $api_upstream en proxy_pass (abajo), esto evita el fallo
    # clásico "host not found in upstream 'api'" y el que nginx apunte a una IP
    # obsoleta cuando el contenedor api se reinicia y cambia de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api;

    # ── Compresión ────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Assets estáticos (JS/CSS generados por CRA con hash en el nombre) ─────
    # Inmutables: el hash garantiza que un cambio = nombre diferente.
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Imágenes y otros recursos públicos con cache de corta duración
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Archivos subidos por usuarios (fotos de perfil) ─────────────────────
    # ^~ impide que la regex de imágenes intercepte estas rutas antes que este bloque.
    location ^~ /static/uploads/ {
        # Variable en proxy_pass => nginx resuelve "api" en runtime via el resolver.
        # $request_uri preserva la ruta y query originales (/static/uploads/...).
        proxy_pass         http://$api_upstream:5000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 30s;
        expires            7d;
        add_header         Cache-Control "public";
        access_log         off;
    }

    # ── Proxy a Flask API ─────────────────────────────────────────────────────
    # Permite que el frontend use URLs relativas (/api/...) y evita CORS en prod.
    # El servicio "api" es el nombre del contenedor en docker-compose.
    #
    # El resolver y $api_upstream están declarados a nivel server (arriba).
    # proxy_pass con variable => resolución dinámica en cada request; $request_uri
    # reenvía la ruta original completa (/api/...), equivalente al proxy_pass
    # estático anterior pero sin cachear la IP del contenedor api.
    location /api/ {
        client_max_body_size 15m;
        proxy_pass         http://$api_upstream:5000$request_uri;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeout generoso para endpoints Spark y AI ETL (Ollama en CPU puede tardar 3-5 min)
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # React Router usa history API: cualquier ruta desconocida sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
