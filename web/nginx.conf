server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compresión ────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Assets estáticos (JS/CSS generados por CRA con hash en el nombre) ─────
    # Inmutables: el hash garantiza que un cambio = nombre diferente.
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Imágenes y otros recursos públicos con cache de corta duración
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Proxy a Flask API ─────────────────────────────────────────────────────
    # Permite que el frontend use URLs relativas (/api/...) y evita CORS en prod.
    # El servicio "api" es el nombre del contenedor en docker-compose.
    location /api/ {
        proxy_pass         http://api:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout generoso para endpoints Spark (análisis pesados)
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # React Router usa history API: cualquier ruta desconocida sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
