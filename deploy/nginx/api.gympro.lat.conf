# deploy/nginx/api.gympro.lat.conf
#
# Vhost de Nginx del HOST (VPS) para api.gympro.lat -- apunta DIRECTO al
# contenedor api (Flask/gunicorn) en 127.0.0.1:5000, no al contenedor web
# (8081). El 5000 solo se expone en loopback en docker-compose.server.yml
# (ports: "127.0.0.1:${API_HOST_PORT:-5000}:5000"), asi que unicamente este
# nginx del host puede llegar a el -- no queda expuesto a internet sin proxy.
#
# Por que no usar el 8081 (como en la guia generica que sugiere GoDaddy/IA):
# el contenedor web tambien escucha ahi, y su nginx interno solo conoce la
# ruta /api/ (ver web/nginx.conf) -- la raiz "/" te serviria el SPA de React,
# lo cual es confuso para un subdominio pensado como "solo API". Apuntando
# directo al 5000, api.gympro.lat/api/... llega a Flask sin pasar por esa capa.
#
# Los clientes (web, movil) siguen llamando con el prefijo /api/ tal cual
# (ej. https://api.gympro.lat/api/auth/login), porque las rutas de Flask ya
# estan registradas con ese prefijo -- no hay reescritura de ruta aqui.
#
# SOLO HTTP en este archivo. `certbot --nginx -d api.gympro.lat` reescribe
# este server block para agregar el bloque 443/SSL automaticamente.

server {
    listen 80;
    listen [::]:80;
    server_name api.gympro.lat;

    # Mismo limite que el proxy interno del contenedor web (subida de fotos/
    # logos en base64 vía JSON).
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_cache_bypass $http_upgrade;

        # Igual que web/nginx.conf: endpoints de Spark/IA con Ollama en CPU
        # pueden tardar varios minutos.
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
